<style>
html,body{height:100%;margin:0;overflow:hidden;background:#bfe0f0;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
#c{z-index:0;touch-action:none}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 50% 38%,#f7fcff 0,#cfe9f6 55%,#a9d3ea 100%)}
#bg i{position:absolute;width:260px;height:90px;border-radius:50%;background:#fff;filter:blur(22px);opacity:.75;animation:drift 38s linear infinite}
#bg .sp{position:absolute;border-radius:50%;background:#fff;filter:none;opacity:0;width:6px;height:6px;animation:rise 18s linear infinite,tw 3s ease-in-out infinite}
#bg .yb{position:absolute;border-radius:50%;filter:none;opacity:.55;animation:rise 60s linear infinite;box-shadow:inset -6px -8px 0 #0002}
@keyframes rise{from{transform:translate(0,105vh) rotate(0)}50%{transform:translate(26px,50vh) rotate(180deg)}to{transform:translate(-10px,-12vh) rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.dk #bg{background:radial-gradient(circle at 50% 38%,#4c4290 0,#2a2f6e 55%,#16224c 100%)}.dk #bg i{opacity:.12}
.rrow{display:flex;gap:10px;justify-content:center;margin-top:2px}.rrow .big{margin:8px 0;width:150px}
.big.r{background:linear-gradient(#6cc0ff,#3b8fe0);box-shadow:0 6px 0 #2a64a8,inset 0 2px 0 #fff7;font-size:20px;padding:10px}
.rv{display:flex;gap:12px;align-items:center;justify-content:center;margin:6px 0}.rv img{width:96px;height:96px;object-fit:contain;background:#dcebf5;border-radius:22px}
.bdg{display:inline-block;color:#fff;border-radius:12px;padding:2px 10px;font-weight:700;font-size:15px}
#bg i:nth-child(1){top:12%;left:-300px}#bg i:nth-child(2){top:46%;left:-300px;animation-duration:52s;animation-delay:-20s;width:340px}#bg i:nth-child(3){top:78%;left:-300px;animation-duration:44s;animation-delay:-8s}
@keyframes drift{to{transform:translateX(calc(100vw + 700px))}}
#cf{z-index:11;pointer-events:none}
.pt{position:fixed;z-index:11;transform:translate(-50%,-50%);font-weight:700;font-size:24px;color:#ffe066;text-shadow:0 2px 0 #0007;pointer-events:none;animation:ptu 1s ease-out forwards}
@keyframes ptu{to{transform:translate(-50%,-170%);opacity:0}}
#uic{z-index:6;pointer-events:none}
button{font:inherit;cursor:pointer}
.hide{display:none!important}
.scr{position:fixed;inset:0;z-index:5}
#home{pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 7vh) 20px calc(env(safe-area-inset-bottom,0px) + 6vh);text-align:center}
#home>*{pointer-events:auto}
h1{margin:0;font-size:clamp(44px,12vw,84px);line-height:.95;font-weight:700;letter-spacing:1px}
h1 span{display:inline-block;color:var(--c);-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #0002;animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d)}
h1 em{display:block;font-style:normal;font-size:.42em;margin-top:6px;color:#e8474c;-webkit-text-stroke:4px #fff;paint-order:stroke fill;letter-spacing:3px}
.sub{color:#4a6a80;font-weight:700;margin:12px 0 0;font-size:16px}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.big{position:relative;display:block;width:230px;margin:12px auto;padding:15px;border:0;border-radius:40px;font-size:28px;font-weight:700;color:#fff;background:linear-gradient(#8fe25f,#5bb637);box-shadow:0 7px 0 #3f8a24,0 12px 14px #0003,inset 0 2px 0 #fff8;text-shadow:0 2px 0 #0003}
.big::after{content:'';position:absolute;inset:5px;border:2px dashed #fff9;border-radius:34px;pointer-events:none}
.big.l{background:linear-gradient(#b3c1d1,#8c9cae);box-shadow:0 6px 0 #5f6f82,inset 0 2px 0 #fff7;font-size:20px;width:150px;padding:10px}
.big.l::after{inset:4px;border-radius:30px}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #0003}
.coin{background:#8a2b2b;border-radius:20px;padding:7px 14px;font-weight:700;box-shadow:0 3px 0 #5a1a1a;white-space:nowrap}
#hc{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px)}
#lvls{background:linear-gradient(#cfe8f5,#eaf5fb);overflow-y:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 40px;box-sizing:border-box}
#prz,#pwr,#dly,#shp{background:linear-gradient(#cfe8f5,#eaf5fb);overflow-y:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 40px;box-sizing:border-box}
#lvls header{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto 6px}
#prz header,#pwr header,#dly header,#shp header{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto 6px}
#lvls h2{margin:0;color:#e8474c;font-size:28px;-webkit-text-stroke:4px #fff;paint-order:stroke fill}
#prz h2,#pwr h2,#dly h2,#shp h2{margin:0;color:#e8474c;font-size:28px;-webkit-text-stroke:4px #fff;paint-order:stroke fill}
#ll{max-width:520px;margin:0 auto}
.tier{background:#fff;border-radius:22px;padding:12px 14px 14px;margin:14px 0;box-shadow:0 5px 0 #0002;border-top:8px solid var(--c)}
.tier h3{margin:0 0 8px;color:var(--c);font-size:22px}
.lr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lb{border:0;border-radius:16px;background:var(--c);color:#fff;padding:4px 3px 6px;position:relative;box-shadow:0 4px 0 #0003}
.lb .th{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:12px;background:radial-gradient(circle at 50% 45%,#ffffffd0,#ffffff40 75%)}
.lb.lk .th{filter:grayscale(.35)}
.lb b{position:absolute;left:5px;top:4px;font-size:12px;line-height:1;background:#0000005a;border-radius:8px;padding:2px 5px}
.lb span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:9.5px;font-weight:500;line-height:1.1;margin-top:3px}
.lb u{position:absolute;right:5px;top:3px;font-size:11px;text-decoration:none}
.lb.nx{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.tier h3 small{font-size:13px;opacity:.7;font-weight:500}
.lb i{position:absolute;right:5px;top:2px;font-size:15px;color:#ffe066;font-style:normal;text-shadow:0 1px 2px #0008}
.lb.lk{filter:saturate(.5);opacity:.85}
.buy{width:100%;margin-bottom:10px;padding:10px;border:0;border-radius:14px;background:#78c850;color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 0 #4c9a2c}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 10px;box-sizing:border-box}
#hud button,#hud .skein.plus,#hud .slot.plus{pointer-events:auto}
.row{display:flex;gap:8px;justify-content:center;align-items:center;margin:9px 0}
.top{justify-content:space-between;flex-wrap:nowrap;gap:6px}.top>div:first-child{display:flex;flex:none}.top>.coin{flex:none}
.ib{color:#fff;width:44px;height:44px;border:0;border-radius:50%;background:linear-gradient(#78a8ee,#4a7ccc);box-shadow:0 4px 0 #2f5a99,inset 0 2px 0 #fff6;display:inline-flex;align-items:center;justify-content:center;margin-right:6px;padding:0}
.ib.r{background:linear-gradient(#ffc04d,#ef9512);box-shadow:0 4px 0 #a86a12,inset 0 2px 0 #fff6}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
.lv{flex:1 1 0;min-width:0;background:#e8474c;box-shadow:0 4px 0 #a52d31;border-radius:20px;padding:7px 10px;font-size:20px;text-align:center;line-height:1.05;font-weight:700}
.lv small,.lv span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lv small{font-size:11px;opacity:.9}
.skein{position:relative;flex:1;max-width:92px;aspect-ratio:1;border-radius:20px;padding:7px;box-sizing:border-box;box-shadow:inset 0 -6px 0 #0003,0 3px 0 #0002}
.skein::after{content:'';position:absolute;inset:3px;border:2px dashed #fff8;border-radius:17px;pointer-events:none}
.skein .p{background:#fffdf7;border-radius:13px;height:100%;box-shadow:inset 0 3px 6px #0003}

 const N=160;if(!thumbRT)thumbRT=new THREE.WebGLRenderTarget(N,N);
 const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0xb8c8d8,.95));const d1=new THREE.DirectionalLight(0xffffff,.9);d1.position.set(4,8,7);sc.add(d1);const d2=new THREE.DirectionalLight(0xffeedd,.35);d2.position.set(-6,-3,-5);sc.add(d2);
 const m=makeModel(L,rngf(1),{p1:0,p2:0,p3:0,p4:0}),w=new THREE.Group();m.g.position.y=-MODELS[L].cy;w.add(m.g);w.scale.setScalar(MODELS[L].k);w.rotation.set(.4,-.6,0);sc.add(w);
 const cm=new THREE.OrthographicCamera(-3.9,3.9,3.9,-3.9,.1,60);cm.position.set(0,0,25);
 ren.setRenderTarget(thumbRT);ren.setClearColor(0x000000,0);ren.clear();ren.render(sc,cm);
 const px=new Uint8Array(N*N*4);ren.readRenderTargetPixels(thumbRT,0,0,N,N,px);ren.setRenderTarget(null);
 const c2=document.createElement('canvas');c2.width=c2.height=N;const x=c2.getContext('2d'),id=x.createImageData(N,N);
 for(let y=0;y<N;y++)id.data.set(px.subarray((N-1-y)*N*4,(N-y)*N*4),y*N*4);x.putImageData(id,0,0);
 m.ps.forEach(p=>p.layers.forEach(l=>l.m.material.dispose()));return c2.toDataURL('image/png')}
function genThumbs(){let L=0;const step=()=>{if(scr!=='lvls'||L>=MODELS.length)return;if(!thumbs[L]){try{thumbs[L]=mkThumb(L)}catch(e){thumbs[L]=BLANK}const im=document.getElementById('t'+L);if(im)im.src=thumbs[L]}L++;setTimeout(step,12)};step()}
function lvlRender(){
 document.querySelectorAll('.cn').forEach(e=>e.textContent=save.coins);
 let reach=0;while(save.done[reach])reach++;
 genThumbs.t=setTimeout(genThumbs,30);
 $('#ll').innerHTML=TIERS.map((n,t)=>{let dn=0;for(let j=0;j<5;j++)if(save.done[t*5+j])dn++;
  return`<section class="tier" style="--c:${TCOL[t]}"><h3>${n} <small>${dn}/5</small></h3><div class="lr">${[0,1,2,3,4].map(j=>{const L=t*5+j,d=save.done[L],cls=d?'':L===reach?' nx':L>reach?' lk':'';
   return`<button class="lb${cls}" data-l="${L}"><img class="th" id="t${L}" alt="" src="${thumbs[L]||BLANK}"><b>${L+1}</b><span>${MODELS[L].name}</span>${d?`<i>${ic('star',15,'#ffe066')}</i>`:''}${L>reach?`<u>${ic('lock',12,'#fff')}</u>`:''}</button>`}).join('')}</div></section>`}).join('');
}
$('#ll').onclick=e=>{const b=e.target.closest('button');if(!b||!b.dataset.l)return;const L=+b.dataset.l;let reach=0;while(save.done[reach])reach++;
 if(L<=reach||save.done[L])startLevel(L);else showOv('Are you sure?',`Level ${L+1} isn't unlocked yet.<br>Beat the earlier levels first, or jump in anyway?`,[{t:'Play anyway',f:()=>startLevel(L)},{t:'Cancel',l:1,f:()=>{}}])};
function toLevels(){if(scr==='game'){skip=true;history.back()}else{history.pushState({s:'lvls'},'');lvlRender();show('lvls')}}
const word='Yarn Unravel'.split(' '),cl=['#e8474c','#f5a623','#78c850','#3b78e0','#9150c8','#e8474c'];let ci=0;
$('#ti').innerHTML=word.map(w=>[...w].map(ch=>`<span style="--c:${cl[ci%6]};--d:${(ci++*.15).toFixed(2)}s">${ch}</span>`).join('')).join('<br>').replace('<br>','<br><em>').replace(/$/,'');
$('#ti').innerHTML=`<span style="--c:#e8474c">Y</span><span style="--c:#f5a623;--d:.15s">a</span><span style="--c:#78c850;--d:.3s">r</span><span style="--c:#3b78e0;--d:.45s">n</span><em>${[...'Unravel'].map((ch,i)=>`<span style="--c:${cl[(i+2)%6]};--d:${(.6+i*.12).toFixed(2)}s;font-size:1em">${ch}</span>`).join('')}</em>`;
$('#play').onclick=toLevels;$('#lb').onclick=()=>history.back();
function confirmLeave(t,msg,f){confirming=true;showOv(t,msg,[{t:'Yes',f:()=>{confirming=false;f()}},{t:'Stay',l:1,f:()=>{confirming=false}}])}
$('#bh').onclick=()=>over?toLevels():gaunt?confirmLeave('Forfeit the Gauntlet?','You only get one life today. Leaving counts as a loss.',()=>{save.gt.s=2;persist();toLevels()}):confirmLeave('Back to levels?','You will lose your progress on this level.<br>Your coins are safe.',toLevels);
$('#br').onclick=()=>confirmLeave('Restart level?','You will lose your progress on this level.<br>Your coins are safe.',()=>startLevel(cur,lastO));
let skip=false,confirming=false;
history.replaceState({s:'home'},'');
addEventListener('popstate',e=>{
 const t=(e.state&&e.state.s)||'home';
 if(scr==='game'&&!skip&&!over){history.pushState({s:'game'},'');if(!confirming)confirmLeave(gaunt?'Forfeit the Gauntlet?':'Leave this level?',gaunt?'You only get one life today. Leaving counts as a loss.':'You will lose your progress on this level.<br>Your coins are safe.',()=>{if(gaunt){save.gt.s=2;persist()}skip=true;history.back()});return}
 skip=false;
 if(t==='game'){if(scr!=='game'){skip=true;history.back()}return}
 if(t==='lvls'){lvlRender();show('lvls')}else if(t==='prz'){prizRender();show('prz')}else if(t==='pwr'){pwrRender();show('pwr')}else if(t==='dly'){dlyRender();show('dly')}else if(t==='shp'){shpRender();show('shp')}else show('home');
});
/* fullscreen: only acts when the toggle is on */
const FSE=document.documentElement,rqF=FSE.requestFullscreen||FSE.webkitRequestFullscreen,inFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
function reqFs(){if(!rqF)return false;try{const p=rqF.call(FSE);p&&p.catch&&p.catch(()=>{})}catch(e){}return true}
function exitFs(){const f=document.exitFullscreen||document.webkitExitFullscreen;try{const p=f&&f.call(document);p&&p.catch&&p.catch(()=>{})}catch(e){}}
['click','pointerup','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(save.fs&&!inFs())reqFs()},true));
const SET=[['music','Music','Cheerful background music.'],['sfx','Sound effects','Button clicks, pops and chimes.'],['fs','Full screen','Keeps asking your device to stay in full screen.'],['vib','Vibration','A little buzz when you unravel and finish skeins.'],['tips','Power-up tips','When you are stuck, open the power-up tray and glow the helpful ones. Never uses anything for you.'],['hq','High quality graphics','Turn this off if the game runs slowly.']];
function openSettings(){const o=$('#ov');
 o.innerHTML='<div><h2>Settings</h2>'+SET.map(r=>`<label class="srow"><span>${r[1]}</span><span class="sw"><input type="checkbox" data-s="${r[0]}"><i></i></span></label><p class="note">${r[2]}</p>`).join('')+'<button class="big" id="dn">Done</button></div>';
 o.classList.remove('hide');
 o.querySelectorAll('input[data-s]').forEach(c=>{const k=c.dataset.s;c.checked=!!save[k];c.onchange=()=>{
  if(k==='fs'){if(c.checked){if(!reqFs()){c.checked=false;toast("Full screen isn't supported on this browser");return}save.fs=true}else{save.fs=false;if(inFs())exitFs()}}
  else{save[k]=c.checked;if(k==='hq'){applyQ();resize()}if(k==='music')syncMusic();if(k==='sfx'&&c.checked)sfx.click()}
  persist()}});
 $('#dn').onclick=()=>o.classList.add('hide');
 }
$('#gear').onclick=openSettings;
$('#xr').onclick=()=>{if(scr!=='game'||over)return;xray=!xray;$('#xr').classList.toggle('on',xray);applyXray();vib(8)};
addEventListener('resize',resize);resize();dayRoll();prizeBadge();show('home');requestAnimationFrame(frame);
