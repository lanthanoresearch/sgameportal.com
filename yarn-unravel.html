<style>
html,body{height:100%;margin:0;overflow:hidden;background:#bfe0f0;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
#c{z-index:0;touch-action:none}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 50% 38%,#f7fcff 0,#cfe9f6 55%,#a9d3ea 100%)}
#bg i{position:absolute;width:260px;height:90px;border-radius:50%;background:#fff;filter:blur(22px);opacity:.75;animation:drift 38s linear infinite}
#bg .sp{position:absolute;border-radius:50%;background:#fff;filter:none;opacity:0;width:6px;height:6px;animation:rise 18s linear infinite,tw 3s ease-in-out infinite}
#bg .yb{position:absolute;border-radius:50%;filter:none;opacity:.55;animation:rise 60s linear infinite;box-shadow:inset -6px -8px 0 #0002}
@keyframes rise{from{transform:translate(0,105vh) rotate(0)}50%{transform:translate(26px,50vh) rotate(180deg)}to{transform:translate(-10px,-12vh) rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.dk #bg{background:radial-gradient(circle at 50% 38%,#4c4290 0,#2a2f6e 55%,#16224c 100%)}.dk #bg i{opacity:.12}
.rrow{display:flex;gap:10px;justify-content:center;margin-top:2px}.rrow .big{margin:8px 0;width:150px}
.big.r{background:linear-gradient(#6cc0ff,#3b8fe0);box-shadow:0 6px 0 #2a64a8,inset 0 2px 0 #fff7;font-size:20px;padding:10px}
.rv{display:flex;gap:12px;align-items:center;justify-content:center;margin:6px 0}.rv img{width:96px;height:96px;object-fit:contain;background:#dcebf5;border-radius:22px}
.bdg{display:inline-block;color:#fff;border-radius:12px;padding:2px 10px;font-weight:700;font-size:15px}
#bg i:nth-child(1){top:12%;left:-300px}#bg i:nth-child(2){top:46%;left:-300px;animation-duration:52s;animation-delay:-20s;width:340px}#bg i:nth-child(3){top:78%;left:-300px;animation-duration:44s;animation-delay:-8s}
@keyframes drift{to{transform:translateX(calc(100vw + 700px))}}
#cf{z-index:11;pointer-events:none}
.pt{position:fixed;z-index:11;transform:translate(-50%,-50%);font-weight:700;font-size:24px;color:#ffe066;text-shadow:0 2px 0 #0007;pointer-events:none;animation:ptu 1s ease-out forwards}
@keyframes ptu{to{transform:translate(-50%,-170%);opacity:0}}
#uic{z-index:6;pointer-events:none}
button{font:inherit;cursor:pointer}
.hide{display:none!important}
.scr{position:fixed;inset:0;z-index:5}
#home{pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 7vh) 20px calc(env(safe-area-inset-bottom,0px) + 6vh);text-align:center}
#home>*{pointer-events:auto}
h1{margin:0;font-size:clamp(44px,12vw,84px);line-height:.95;font-weight:700;letter-spacing:1px}
h1 span{display:inline-block;color:var(--c);-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #0002;animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d)}

.sub{color:#4a6a80;font-weight:700;margin:12px 0 0;font-size:16px}

.coin{background:#8a2b2b;border-radius:20px;padding:7px 14px;font-weight:700;box-shadow:0 3px 0 #5a1a1a;white-space:nowrap}

#lvls h2{margin:0;color:#e8474c;font-size:28px;-webkit-text-stroke:4px #fff;paint-order:stroke fill}
#prz h2,#pwr h2,#dly h2,#shp h2{margin:0;color:#e8474c;font-size:28px;-webkit-text-stroke:4px #fff;paint-order:stroke fill}
#ll{max-width:520px;margin:0 auto}

.buy{width:100%;margin-bottom:10px;padding:10px;border:0;border-radius:14px;background:#78c850;color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 0 #4c9a2c}

.row{display:flex;gap:8px;justify-content:center;align-items:center;margin:9px 0}

.ib{color:#fff;width:44px;height:44px;border:0;border-radius:50%;background:linear-gradient(#78a8ee,#4a7ccc);box-shadow:0 4px 0 #2f5a99,inset 0 2px 0 #fff6;display:inline-flex;align-items:center;justify-content:center;margin-right:6px;padding:0}

.lv{flex:1 1 0;min-width:0;background:#e8474c;box-shadow:0 4px 0 #a52d31;border-radius:20px;padding:7px 10px;font-size:20px;text-align:center;line-height:1.05;font-weight:700}

#hb em.fr{background:#2e8b57;box-shadow:0 2px 0 #1b5e3a}

.sw{width:48px;height:48px;border-radius:16px;flex:none;border:3px solid #fff;box-shadow:0 2px 0 #0003;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}

.coin{display:flex;align-items:center;gap:4px}

.srow{display:flex;justify-content:space-between;align-items:center;gap:24px;font-weight:600;font-size:20px;margin:14px 0 6px}
.sw{position:relative;width:56px;height:32px;flex:none}.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;z-index:1;cursor:pointer}

html{-webkit-tap-highlight-color:transparent}

.ic{display:inline-block;vertical-align:middle;flex:none}
.coin{gap:6px}

#hd.warn .slot:not(.jam){animation:none}
@keyframes wn{50%{box-shadow:0 0 0 3px #e8474c,0 0 12px #e8474c88}}

const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==',thumbs={};let thumbRT=null;
function mkThumb(L){
 const N=160;if(!thumbRT)thumbRT=new THREE.WebGLRenderTarget(N,N);
 const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0xb8c8d8,.95));const d1=new THREE.DirectionalLight(0xffffff,.9);d1.position.set(4,8,7);sc.add(d1);const d2=new THREE.DirectionalLight(0xffeedd,.35);d2.position.set(-6,-3,-5);sc.add(d2);
 const m=makeModel(L,rngf(1),{p1:0,p2:0,p3:0,p4:0}),w=new THREE.Group();m.g.position.y=-MODELS[L].cy;w.add(m.g);w.scale.setScalar(MODELS[L].k);w.rotation.set(.4,-.6,0);sc.add(w);

 ren.setRenderTarget(thumbRT);ren.setClearColor(0x000000,0);ren.clear();ren.render(sc,cm);
 const px=new Uint8Array(N*N*4);ren.readRenderTargetPixels(thumbRT,0,0,N,N,px);ren.setRenderTarget(null);
 const c2=document.createElement('canvas');c2.width=c2.height=N;const x=c2.getContext('2d'),id=x.createImageData(N,N);
 for(let y=0;y<N;y++)id.data.set(px.subarray((N-1-y)*N*4,(N-y)*N*4),y*N*4);x.putImageData(id,0,0);
 m.ps.forEach(p=>p.layers.forEach(l=>l.m.material.dispose()));return c2.toDataURL('image/png')}
function genThumbs(){let L=0;const step=()=>{if(scr!=='lvls'||L>=MODELS.length)return;if(!thumbs[L]){try{thumbs[L]=mkThumb(L)}catch(e){thumbs[L]=BLANK}const im=document.getElementById('t'+L);if(im)im.src=thumbs[L]}L++;setTimeout(step,12)};step()}

const FSE=document.documentElement,rqF=FSE.requestFullscreen||FSE.webkitRequestFullscreen,inFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
function reqFs(){if(!rqF)return false;try{const p=rqF.call(FSE);p&&p.catch&&p.catch(()=>{})}catch(e){}return true}
function exitFs(){const f=document.exitFullscreen||document.webkitExitFullscreen;try{const p=f&&f.call(document);p&&p.catch&&p.catch(()=>{})}catch(e){}}
['click','pointerup','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(save.fs&&!inFs())reqFs()},true));

 $('#dn').onclick=()=>o.classList.add('hide');
 }
