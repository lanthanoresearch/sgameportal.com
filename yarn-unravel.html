html,body{height:100%;margin:0;overflow:hidden;background:#bfe0f0;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
#c{z-index:0;touch-action:none}
body{background:transparent!important}
#tmr{position:relative;font:700 14px/1 Fredoka,system-ui,sans-serif;font-style:normal;background:#0006;color:#fff;border-radius:14px;padding:5px 12px;white-space:nowrap;display:flex;align-items:center;gap:4px;box-shadow:0 2px 0 #0003;transition:background .3s}#tmr:not(.on){opacity:.8}#tmr.late{background:#7a2b2b99}#tmr b{color:#ffd23f;display:inline-flex;align-items:center;gap:3px}
#parb{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 306px);transform:translateX(-50%);z-index:8;pointer-events:none;background:#fff;color:#35506a;border-radius:20px;padding:9px 16px 10px;box-shadow:0 6px 18px #0004;text-align:center;font:700 15px/1.25 Fredoka,system-ui,sans-serif;animation:parb 3.6s ease both;max-width:84vw}#parb b{color:#d98a00}#parb small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
@keyframes parb{0%{opacity:0;transform:translate(-50%,-14px) scale(.9)}10%,82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.96)}}
.tier .stars{float:right;display:inline-flex;gap:1px;margin-top:1px}.tier.perfect h3{text-shadow:0 0 12px #ffd23f}.lb.ok i,.lb.st i{border-radius:50%;padding:2px;display:flex;box-shadow:0 1px 0 #0003}.lb.ok i{background:#4caf50}.lb.st i{background:#f0a500}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 50% 38%,#f7fcff 0,#cfe9f6 55%,#a9d3ea 100%)}
#bg i{position:absolute;width:260px;height:90px;border-radius:50%;background:#fff;filter:blur(22px);opacity:.75;animation:drift 38s linear infinite}
#bg .sp{position:absolute;border-radius:50%;background:#fff;filter:none;opacity:0;width:6px;height:6px;animation:rise 18s linear infinite,tw 3s ease-in-out infinite}
#bg .yb{position:absolute;border-radius:50%;filter:none;opacity:.55;animation:rise 60s linear infinite;box-shadow:inset -6px -8px 0 #0002}
@keyframes rise{from{transform:translate(0,105vh) rotate(0)}50%{transform:translate(26px,50vh) rotate(180deg)}to{transform:translate(-10px,-12vh) rotate(360deg)}}
#bg[data-th]:not([data-th=sky]) .yb{display:none}#bg[data-th=night] i:not(.fx),#bg[data-th=gold] i:not(.fx){display:none}
#bg .fx{position:absolute;pointer-events:none;filter:none;opacity:1;animation:none;width:auto;height:auto}

$('#pmenu').onclick=e=>{e.stopPropagation();const b=e.target.closest('[data-m]');if(!b)return;save.pmode=b.dataset.m;persist();sfx.click();pmRender();$('#pmenu').classList.add('hide')};

pmRender();
$('#lb').onclick=()=>history.back();
function backHome(){const rnd=rmode&&!(lastO&&lastO.tr!=null)&&!gaunt;toLevels();if(rnd)setTimeout(()=>{if(rcfg)randOv()},350)}
function confirmLeave(t,msg,f){confirming=true;showOv(t,msg,[{t:'Yes',f:()=>{confirming=false;f()}},{t:'Stay',l:1,f:()=>{confirming=false}}])}
const backName=()=>lastO&&lastO.tr!=null?'Trail':rmode?'Random':gaunt?'Challenges':'Levels';
function parBanner(){const o=$('#parb');if(o)o.remove();if(rmode||gaunt||save.tmr===false)return;const d=document.createElement('div');d.id='parb';d.innerHTML=`${ic('star',16,'#ffd23f')} Beat <b>${fmtM(curPar)}</b> for a star<small>The timer starts when you first touch the puzzle.</small>`;document.body.appendChild(d);setTimeout(()=>d.remove(),3700)}
['pointerdown','wheel','keydown'].forEach(ev=>addEventListener(ev,()=>{if(scr==='game'&&!levelT0&&!over&&$('#ov').classList.contains('hide'))levelT0=performance.now()},true));
const backBtn=()=>{const n=backName(),b=$('#bh');b.setAttribute('aria-label','Back to '+n);b.title='Back to '+n};
$('#bh').onclick=()=>over?backHome():gaunt?confirmLeave('Forfeit the Gauntlet?','You only get one life today. Leaving counts as a loss.',()=>{save.gt.s=2;persist();backHome()}):confirmLeave('Back to '+backName()+'?','You will lose your progress on this level.<br>Your coins are safe.',backHome);
$('#br').onclick=()=>confirmLeave('Restart level?','You will lose your progress on this level.<br>Your coins are safe.',()=>startLevel(cur,lastO));
let skip=false,confirming=false;
history.replaceState({s:'home'},'');
addEventListener('popstate',e=>{
 const t=(e.state&&e.state.s)||'home';
 if(scr==='game'&&!skip&&!over){history.pushState({s:'game'},'');if(!confirming)confirmLeave(gaunt?'Forfeit the Gauntlet?':'Leave this level?',gaunt?'You only get one life today. Leaving counts as a loss.':'You will lose your progress on this level.<br>Your coins are safe.',()=>{if(gaunt){save.gt.s=2;persist()}skip=true;history.back()});return}
 skip=false;
 if(t==='game'){if(scr!=='game'){skip=true;history.back()}return}
 if(t==='lvls'){lvlRender();show('lvls')}else if(t==='prz'){prizRender();show('prz')}else if(t==='pwr'){pwrRender();show('pwr')}else if(t==='dly'){dlyRender();show('dly')}else if(t==='shp'){shpRender();show('shp')}else if(t==='trl'){trlRender();show('trl')}else show('home');
});
/* fullscreen: only acts when the toggle is on */
const FSE=document.documentElement,rqF=FSE.requestFullscreen||FSE.webkitRequestFullscreen,inFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
function reqFs(){if(!rqF)return false;try{const p=rqF.call(FSE);p&&p.catch&&p.catch(()=>{})}catch(e){}return true}
function exitFs(){const f=document.exitFullscreen||document.webkitExitFullscreen;try{const p=f&&f.call(document);p&&p.catch&&p.catch(()=>{})}catch(e){}}
['click','pointerup','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(save.fs&&!inFs())reqFs()},true));
const SET=[['music','Music','Cheerful background music.'],['sfx','Sound effects','Button clicks, pops and chimes.'],['fs','Full screen','Keeps asking your device to stay in full screen.'],['tmr','Show timer &amp; par time','Shows your time and the par time during levels. The timer keeps running either way.'],['prg','Show level progress','The small count under the level name, like 12/48 pieces unraveled.'],['vib','Vibration','A little buzz when you unravel and finish skeins.'],['hq','High quality graphics','Turn this off if the game runs slowly.']];
function openSettings(){const o=$('#ov');
 o.innerHTML='<div><h2>Settings</h2>'+SET.map(r=>`<label class="srow"><span>${r[1]}</span><span class="sw"><input type="checkbox" data-s="${r[0]}"><i></i></span></label><p class="note">${r[2]}</p>`).join('')+'<button class="big" id="dn">Done</button></div>';
 o.classList.remove('hide');
 o.querySelectorAll('input[data-s]').forEach(c=>{const k=c.dataset.s;c.checked=(k==='tmr'||k==='prg')?save[k]!==false:!!save[k];c.onchange=()=>{
  if(k==='fs'){if(c.checked){if(!reqFs()){c.checked=false;toast("Full screen isn't supported on this browser");return}save.fs=true}else{save.fs=false;if(inFs())exitFs()}}
  else{save[k]=c.checked;if(k==='hq'){applyQ();resize()}if(k==='prg')document.body.classList.toggle('noprg',!c.checked);if(k==='music')syncMusic();if(k==='sfx'&&c.checked)sfx.click()}
  persist()}});
 $('#dn').onclick=()=>o.classList.add('hide');
 }
$('#gear').onclick=openSettings;
$('#xr').onclick=()=>{if(scr!=='game'||over)return;xray=!xray;$('#xr').classList.toggle('on',xray);applyXray();vib(8)};
addEventListener('resize',resize);resize();dayRoll();prizeBadge();show('home');mkLabel();setTimeout(mkPopup,900);requestAnimationFrame(frame);document.body.classList.toggle('noprg',save.prg===false);
