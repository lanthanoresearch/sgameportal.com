<style>
  :root{
    --sky-top:#0347c8; --sky-mid:#0a7ae8; --sky-low:#5cc8fb;
    --serif:'Playfair Display','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
    --marker:'Permanent Marker','Segoe UI',system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    color:#fff; font-family:var(--serif);
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    gap:clamp(14px,3.4vh,32px);
    -webkit-tap-highlight-color:transparent;
    /* the icon's sky: deep blue at the top fading to light blue, with soft clouds */
    background:
      radial-gradient(ellipse 22% 9% at 14% 12%, rgba(255,255,255,.95), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 15% 6% at 32% 22%, rgba(255,255,255,.75), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 18% 7% at 84% 10%, rgba(255,255,255,.9), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 20% 8% at 92% 46%, rgba(255,255,255,.8), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 17% 7% at 6% 62%, rgba(255,255,255,.8), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 14% 5% at 60% 84%, rgba(255,255,255,.55), rgba(255,255,255,0) 72%),
      linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    background-attachment:fixed;
  }
  h1{
    margin:0; font-weight:700; line-height:1; letter-spacing:.14em; text-indent:.14em;
    font-size:clamp(34px,7vw,66px); text-align:center; color:#fff;
    text-shadow:0 2px 0 rgba(120,175,255,.9), 0 6px 18px rgba(0,40,140,.55);
  }
  .grid{ width:min(1100px,100%); display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(10px,2vw,20px); }

  .tile{
    position:relative; display:block; aspect-ratio:4/3; border-radius:14px; overflow:hidden;
    border:2px solid rgba(255,255,255,.35); text-decoration:none; color:inherit;
    box-shadow:0 10px 30px rgba(0,30,120,.35);
  }
  .tile .name{
    position:absolute; left:0; right:0; bottom:0; padding:clamp(10px,2vw,18px) 14px 12px;
    font-size:clamp(18px,2.6vw,28px); letter-spacing:2px; text-align:center; line-height:1.15;
  }

  /* Rampage keeps its own look: black, red, marker font */
  .tile.live{ background:#000; cursor:pointer; font-family:var(--marker); transition:border-color .15s, box-shadow .15s, transform .15s; }
  .tile.live img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:52% 50%; image-rendering:pixelated; image-rendering:crisp-edges; filter:brightness(.7); transition:filter .15s; }
  .tile.live::after{ content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0) 55%); pointer-events:none; }
  .tile.live .name{ z-index:2; color:#fff; text-shadow:2px 2px 0 #400; font-family:var(--marker); font-weight:400; letter-spacing:3px; }
  .tile.live .go{
    position:absolute; z-index:2; top:12px; right:12px; background:#f00; color:#000; border-radius:6px;
    padding:7px 12px 6px; font:400 15px/1 var(--marker); letter-spacing:1.5px;
  }
  .tile.live:hover, .tile.live:focus-visible{ border-color:#fff; box-shadow:0 12px 44px rgba(255,0,0,.45); outline:none; }
  .tile.live:hover img, .tile.live:focus-visible img{ filter:brightness(.95); }
  .tile.live:active{ transform:scale(.99); }

  /* coming-soon tiles: plain gray, no image, not clickable (they will get their own themes later) */
  .tile.soon{ background:#2c2c2c; border-color:rgba(255,255,255,.22); cursor:default; user-select:none; }
  .tile.soon .name{ top:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#a9a9a9; padding-bottom:0; font-weight:600; }
  .tile.soon .badge{
    font:700 clamp(10px,1.5vw,12px)/1 var(--serif); letter-spacing:3px; color:#8a8a8a;
    border:1px solid #5a5a5a; border-radius:5px; padding:6px 10px;
  }

  @media (max-width:640px){
    .grid{ grid-template-columns:1fr; }
    .tile{ aspect-ratio:16/9; }
  }
  @media (orientation:landscape) and (max-height:520px){
    body{ gap:8px; padding-top:8px; padding-bottom:8px; }
    h1{ font-size:clamp(26px,9vh,40px); }
  }
</style>
