<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
body{position:fixed;inset:0;font-family:"Microsoft Sans Serif","MS Sans Serif",Tahoma,Arial,"Liberation Sans",Helvetica,sans-serif}
#viewport{position:absolute;inset:0;overflow:hidden;background:#000}
.form{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;cursor:default;display:none}
.form.on{display:block}
.ctl{position:absolute;box-sizing:border-box}
.cl{position:absolute;overflow:hidden}
.ctl.hide{display:none!important}
.noptr{pointer-events:none}
/* shapes / lines / images are lightweight: not hit-testable */
.shp,.lin,.img{pointer-events:none}
.img{image-rendering:pixelated;display:block}
.img img{width:100%;height:100%;display:block;image-rendering:pixelated;pointer-events:none}
.img.ptr{pointer-events:auto}
.lin{position:absolute;transform-origin:0 0}
.lbl,.chk,.opt,.btn,.txt,.frm,.hsb{font-size:11px;line-height:normal;white-space:pre-wrap;overflow-wrap:anywhere;color:#000}
.lbl{overflow:visible}
.lbl.d3{box-shadow:inset 1px 1px #a0a0a0,inset -1px -1px #fff,inset 2px 2px #696969,inset -2px -2px #e3e3e3}
.lbl.flat{box-shadow:inset 0 0 0 1px #646464}
.dis{color:#6d6d6d!important;text-shadow:1px 1px 0 #fff}
/* picture box / frame borders */
.pic .bd{position:absolute;inset:0;pointer-events:none}
.pic.d3 .bd{box-shadow:inset 1px 1px #a0a0a0,inset -1px -1px #fff,inset 2px 2px #696969,inset -2px -2px #e3e3e3}
.pic.flat .bd{box-shadow:inset 0 0 0 1px #646464}
.frm .box{position:absolute;left:0;right:0;bottom:0;top:7px;border:1px solid #a0a0a0;box-shadow:1px 1px 0 #fff,inset 1px 1px 0 #fff;pointer-events:none}
.frm .cap{position:absolute;left:8px;top:0;padding:0 2px;white-space:pre;line-height:13px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;text-align:center;cursor:default;
  box-shadow:inset -1px -1px #696969,inset 1px 1px #fff,inset -2px -2px #a0a0a0,inset 2px 2px #e3e3e3;padding:0 3px}
.btn.down{box-shadow:inset -1px -1px #fff,inset 1px 1px #696969,inset -2px -2px #e3e3e3,inset 2px 2px #a0a0a0;padding:2px 0 0 4px}
.btn:focus{outline:1px dotted #000;outline-offset:-5px}
.btn .t{max-width:100%;max-height:100%;overflow:hidden}
.btn.fu .t{text-decoration:underline}
/* check / option */
.chk,.opt{display:flex;align-items:center;cursor:default;padding-left:0}
.chk .box{flex:none;width:13px;height:13px;background:#fff;position:relative;
  box-shadow:inset 1px 1px #a0a0a0,inset -1px -1px #fff,inset 2px 2px #696969,inset -2px -2px #e3e3e3}
.chk.dis .box{background:#f0f0f0}
.chk .box svg{position:absolute;left:2px;top:2px;display:none}
.chk.on .box svg{display:block}
.opt .rad{flex:none;width:12px;height:12px;border-radius:50%;background:#fff;position:relative;
  box-shadow:inset 1px 1px #a0a0a0,inset -1px -1px #fff,inset 2px 2px #696969,inset -2px -2px #e3e3e3}
.opt.flat .rad{box-shadow:inset 0 0 0 1px #646464}
.opt.dis .rad{background:#f0f0f0}
.opt .rad i{position:absolute;left:4px;top:4px;width:4px;height:4px;border-radius:50%;background:#000;display:none}
.opt.on .rad i{display:block}
.opt.dis.on .rad i{background:#a0a0a0}
.chk .tx,.opt .tx{margin-left:4px;flex:1 1 auto;min-width:0}
.chk:focus,.opt:focus{outline:none}
.chk:focus .tx,.opt:focus .tx{outline:1px dotted #000}
/* text box */
.txt{background:#fff;border:0;margin:0;padding:1px 2px;font-family:inherit;resize:none;overflow:hidden;color:#000;border-radius:0}
.txt.d3{box-shadow:inset 1px 1px #a0a0a0,inset -1px -1px #fff,inset 2px 2px #696969,inset -2px -2px #e3e3e3;padding:2px 3px}
.txt.flat{box-shadow:inset 0 0 0 1px #646464}
.txt:focus{outline:none}
.txt:disabled{color:#6d6d6d;-webkit-text-fill-color:#6d6d6d;opacity:1}
textarea.txt{white-space:pre-wrap;overflow-wrap:anywhere}
/* scroll bar */
.hsb{background:#f0f0f0;background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%),linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%);background-size:2px 2px;background-position:0 0,1px 1px}
.hsb .ar,.hsb .th{position:absolute;top:0;bottom:0;background:#f0f0f0;
  box-shadow:inset -1px -1px #696969,inset 1px 1px #fff,inset -2px -2px #a0a0a0,inset 2px 2px #e3e3e3}
.hsb .ar{width:17px}
.hsb .ar svg{position:absolute;left:5px;top:4px}
.hsb.dis .th{display:none}
/* menu */
#popmenu{position:fixed;z-index:9000;background:#f0f0f0;border:1px solid #a0a0a0;box-shadow:2px 2px 4px rgba(0,0,0,.35);padding:2px;display:none;font:12px "Segoe UI",Tahoma,Arial,sans-serif;color:#000}
#popmenu div{padding:4px 22px 4px 14px;white-space:nowrap}
#popmenu div:hover{background:#91c9f7}
/* dialog */
#dlgback{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:10000;display:none;align-items:center;justify-content:center;touch-action:none}
#dlgback.on{display:flex}
#dlg{background:#fff;border:1px solid #1883d7;box-shadow:0 8px 32px rgba(0,0,0,.45);min-width:min(340px,92vw);max-width:min(560px,94vw);max-height:92vh;display:flex;flex-direction:column;font-family:"Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif;color:#000;-webkit-user-select:none;user-select:none}
#dlg .tb{height:31px;display:flex;align-items:center;padding:0 12px;font-size:12px;background:#fff;color:#000;flex:none;letter-spacing:.01em}
#dlg .bd{display:flex;gap:16px;padding:20px 24px 22px;font-size:15px;line-height:1.35;overflow:auto;min-height:0;flex:1 1 auto;background:#fff}
#dlg .ic{flex:none;width:36px;height:36px;margin-top:2px}
#dlg .ic:empty{display:none}
#dlg .msg{white-space:pre-wrap;overflow-wrap:anywhere;flex:1 1 auto;min-width:0;align-self:center}
#dlg .bt{background:#f0f0f0;padding:14px 20px 14px;display:flex;justify-content:flex-end;gap:10px;flex:none;border-top:1px solid #dfdfdf}
#dlg button{min-width:88px;height:30px;font:14px "Segoe UI",Tahoma,Arial,sans-serif;background:#e1e1e1;border:1px solid #adadad;color:#000;cursor:pointer;padding:0 14px;border-radius:0}
#dlg button:hover{background:#e5f1fb;border-color:#0078d7}
#dlg button:active{background:#cce4f7;border-color:#005499}
#dlg button.def{border:2px solid #0078d7;padding:0 13px}
#dlg button:focus{outline:none}
#dlg button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
/* touch pad */
#pad{position:fixed;z-index:8000;display:none;touch-action:none;width:204px;height:236px;user-select:none;-webkit-user-select:none}
#pad.on{display:block}
#pad .grip{position:absolute;left:0;top:0;right:0;height:28px;border-radius:12px 12px 0 0;background:rgba(40,40,40,.78);color:#ddd;font:11px "Segoe UI",Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;cursor:move;touch-action:none;letter-spacing:.06em}
#pad .body{position:absolute;left:0;top:28px;right:0;bottom:0;border-radius:0 0 12px 12px;background:rgba(40,40,40,.40)}
#pad .k{position:absolute;width:64px;height:64px;border-radius:14px;background:rgba(245,245,245,.82);border:2px solid rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;touch-action:none}
#pad .k.p{background:rgba(255,255,255,.98);transform:scale(.94)}
#pad .k svg{pointer-events:none}
#pad .c{position:absolute;left:70px;top:70px;width:60px;height:60px;border-radius:50%;border:3px solid rgba(0,0,0,.55);pointer-events:none}

/* ================= layers (transparent on desktop) ================= */
.lyr{display:contents}
.ovbox>.ctl,.ovel>.ctl{pointer-events:auto}
body.split .form.split{overflow:hidden}

/* ================= top bar (phones) ================= */
#mbar{position:fixed;z-index:6000;display:none;align-items:center;justify-content:space-between;gap:6px;padding:0 6px;box-sizing:border-box;background:#111;border-bottom:1px solid #333;font:700 12px "Segoe UI",Tahoma,Arial,sans-serif;color:#ddd;letter-spacing:.04em}
#mbar button,.gbtn{font:700 12px "Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.05em;color:#111;background:#efefef;border:2px solid #fff;border-right-color:#606060;border-bottom-color:#606060;padding:5px 10px;min-height:28px;touch-action:manipulation}

/* ================= boot / title / settings ================= */
#boot,#title{position:fixed;inset:0;z-index:9000;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Tahoma,Arial,sans-serif;transition:opacity .45s}
#boot.gone,#title.gone{opacity:0;pointer-events:none}
#boot .in{width:min(78vw,380px);text-align:center}
#boot h1,#title h1{margin:0;font-weight:900;letter-spacing:.14em;line-height:1.04}
#boot h1{font-size:clamp(26px,7vw,40px)}

#title h1{font-size:clamp(30px,9.2vw,56px)}
#title h1 span{color:#e81123}
#title .sub{font-size:11px;letter-spacing:.3em;opacity:.7;margin:10px 0 22px}
#title .btns{display:flex;flex-direction:column;gap:12px}
.tbtn{font:800 16px "Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.2em;color:#111;background:#f0f0f0;border:3px solid #fff;border-right-color:#6a6a6a;border-bottom-color:#6a6a6a;padding:13px 10px;cursor:pointer;touch-action:manipulation}
.tbtn:active{border:3px solid #6a6a6a;border-right-color:#fff;border-bottom-color:#fff;background:#d6d6d6}
.tbtn.play{font-size:26px;padding:16px 10px;background:#fff;letter-spacing:.34em}
.tbtn.row{display:flex;gap:12px;padding:0;border:0;background:none}
.tbtn.row button{flex:1;font:inherit;letter-spacing:.14em;font-size:13px;color:#111;background:#f0f0f0;border:3px solid #fff;border-right-color:#6a6a6a;border-bottom-color:#6a6a6a;padding:11px 6px;cursor:pointer;touch-action:manipulation}
.tbtn.row button:active{border:3px solid #6a6a6a;border-right-color:#fff;border-bottom-color:#fff;background:#d6d6d6}

#settings{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
#settings.on{display:flex}
#settings .win{width:min(92vw,440px);max-height:92vh;overflow:auto;background:#f0f0f0;color:#000;border:1px solid #0078d7;box-shadow:0 8px 40px rgba(0,0,0,.6)}
#settings .tb{background:#fff;padding:9px 14px;font-size:13px;font-weight:700;letter-spacing:.14em;border-bottom:1px solid #d5d5d5}
#settings .rows{padding:6px 16px 4px}
#settings .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #dcdcdc;font-size:13px;letter-spacing:.05em}

.tog.on{background:#0a8f2c;color:#fff;border-color:#43c05f;border-right-color:#045d19;border-bottom-color:#045d19}
.tog[disabled]{opacity:.45}
#settings input[type=range]{width:150px;accent-color:#0078d7;height:28px}
#settings .bt{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;background:#e9e9e9;border-top:1px solid #d0d0d0}
#settings .bt button{min-width:96px;font:600 13px "Segoe UI",Tahoma,Arial,sans-serif;padding:8px 14px;color:#111;background:#e1e1e1;border:1px solid #adadad;cursor:pointer;touch-action:manipulation}
#settings .bt button.def{border:2px solid #0078d7}
#pad .k{background:rgba(245,245,245,.6)}
#pad .body{background:rgba(40,40,40,.22)}
#boot.off,#title.off{display:none}
#settings .win{display:flex;flex-direction:column;max-height:94vh;max-height:94dvh}
#settings .rows{overflow:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch}
#settings .tb,#settings .bt{flex:none}

  #settings .row{padding:6px 0;font-size:12px}

}

/* --- buttons drawn by the game (keep their BackColor, add depth) --- */
.btn{border-radius:7px;font-weight:500;letter-spacing:0;
  box-shadow:0 0 0 1px rgba(0,0,0,.38),0 2px 0 rgba(0,0,0,.34),0 3px 5px rgba(0,0,0,.16),inset 0 1px 0 var(--hi),inset 0 -8px 12px rgba(0,0,0,.05);
  transition:transform .07s,box-shadow .07s,filter .12s;padding:0 2px}
.btn:hover:not(.dis){filter:brightness(1.07)}
.btn.down{transform:translateY(2px);padding:0 2px;filter:brightness(.94);
  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 0 rgba(0,0,0,0),inset 0 2px 4px rgba(0,0,0,.22)}
.btn:focus{outline:none}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn.dis{opacity:.5;filter:grayscale(.55);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dis{color:#5a5a5a!important;text-shadow:none;opacity:.62}
.btn.dis,.chk.dis,.opt.dis{opacity:.5}
/* --- group frames / panels / labels --- */
.frm .box{border:1px solid rgba(0,0,0,.34);border-radius:8px;box-shadow:none;background:rgba(255,255,255,.07)}
.pic.d3 .bd,.pic.flat .bd{box-shadow:inset 0 0 0 1px rgba(0,0,0,.26)}
.lbl.d3,.lbl.flat{box-shadow:inset 0 0 0 1px rgba(0,0,0,.34);border-radius:5px}
/* --- check boxes and option buttons --- */
.chk .box{width:15px;height:15px;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.55);transition:background .1s}
.chk .box svg{left:3px;top:3px}
.chk .box svg path{stroke:#fff}
.chk.on .box{background:#1b1b1b;box-shadow:inset 0 0 0 1.5px #000}
.chk.dis .box{background:#e6e6e6}.chk.dis.on .box{background:#8a8a8a}
.opt .rad{width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.55)}
.opt .rad i{left:3.5px;top:3.5px;width:8px;height:8px;background:#1b1b1b;transform:scale(0);transition:transform .1s;display:block}
.opt.on .rad i{transform:scale(1)}
.opt.on .rad{box-shadow:inset 0 0 0 1.5px #000}
.opt.dis .rad{background:#e6e6e6}.opt.dis.on .rad i{background:#8a8a8a}
.chk:hover:not(.dis) .box,.opt:hover:not(.dis) .rad{box-shadow:inset 0 0 0 1.5px #000,0 0 0 3px rgba(11,132,255,.25)}
.chk:focus-visible .box,.opt:focus-visible .rad{box-shadow:inset 0 0 0 1.5px #000,0 0 0 3px rgba(11,132,255,.6)}
.chk:focus .tx,.opt:focus .tx{outline:none}
/* --- text boxes --- */
.txt{border-radius:5px}
.txt.d3,.txt.flat{box-shadow:inset 0 0 0 1px rgba(0,0,0,.42),inset 0 1px 3px rgba(0,0,0,.14)}
.txt:focus{box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 0 0 2px rgba(11,132,255,.65)}
/* --- volume slider --- */
.hsb{background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)) center/100% 4px no-repeat;border-radius:9px}
.hsb .ar{background:transparent;box-shadow:none}
.hsb .ar svg{display:none}
.hsb .th{background:#fff;border-radius:9px;box-shadow:0 0 0 1.5px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.3)}
/* --- context menu + game dialogs --- */
#popmenu{border-radius:8px;border:0;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#popmenu div{border-radius:5px;padding:7px 22px 7px 14px}
#dlg{border:0;border-radius:12px;overflow:hidden;box-shadow:0 14px 48px rgba(0,0,0,.55)}
#dlg .tb{height:36px;font-weight:700;letter-spacing:.1em;font-size:11px;background:#111;color:#fff}
#dlg .bt{background:#f2f2f2}
#dlg button{border-radius:8px;border:0;font-weight:700;letter-spacing:.04em;background:linear-gradient(#fff,#e6e6e6);box-shadow:0 2px 0 #8c8c8c,0 3px 5px rgba(0,0,0,.22);height:34px;transition:transform .07s,box-shadow .07s}
#dlg button:hover{background:linear-gradient(#fff,#eef6ff)}
#dlg button:active{transform:translateY(2px);box-shadow:0 0 0 #8c8c8c}
#dlg button.def{border:0;padding:0 14px;background:linear-gradient(#2d9bff,#0b6fe0);color:#fff;box-shadow:0 2px 0 #064a9a,0 3px 6px rgba(11,111,224,.4)}
#dlg button.def:hover{background:linear-gradient(#45a8ff,#1a7bec)}
/* --- chrome buttons (title, top bar, tabs, settings): one shared look --- */
.gbtn,#mbar button,.tbtn,.tbtn.row button,#settings .bt button,.tog,.cbtn,#dtabs .chips button{
  border:0;border-radius:10px;background:linear-gradient(#fff,#e3e3e3);color:#111;
  box-shadow:0 3px 0 #8a8a8a,0 5px 8px rgba(0,0,0,.35),inset 0 1px 0 #fff;
  font-weight:800;letter-spacing:.09em;transition:transform .07s,box-shadow .07s,filter .12s}
.gbtn:active,#mbar button:active,.tbtn:active,.tbtn.row button:active,#settings .bt button:active,.tog:active,.cbtn:active{
  transform:translateY(2px);box-shadow:0 1px 0 #8a8a8a,0 2px 4px rgba(0,0,0,.35),inset 0 1px 0 #fff;background:linear-gradient(#f0f0f0,#d6d6d6)}
.tbtn.play{background:linear-gradient(#ff3b4e,#d40f23);color:#fff;box-shadow:0 4px 0 #86000f,0 8px 16px rgba(232,17,35,.38)}
.tbtn.play:active{background:linear-gradient(#e92f41,#bf0c1f);box-shadow:0 1px 0 #86000f,0 3px 8px rgba(232,17,35,.38)}
.tog.on{background:linear-gradient(#29c455,#0a8f2c);color:#fff;box-shadow:0 3px 0 #05601c,0 5px 8px rgba(0,0,0,.3)}
#settings .bt button.def{background:linear-gradient(#2d9bff,#0b6fe0);color:#fff;box-shadow:0 3px 0 #064a9a,0 5px 8px rgba(0,0,0,.3)}
#settings .win{border:0;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.6)}
#settings .tb{background:#111;color:#fff;font-size:12px}
#settings input[type=range]{accent-color:#e81123}
#title .box{border-radius:18px;border:2px solid rgba(255,255,255,.9)}
#boot .bar{border-radius:8px}#boot .bar i{border-radius:4px}
#mbar{background:linear-gradient(#1c1c1c,#101010);border-bottom:1px solid #2c2c2c}
#mbar button{padding:6px 12px;min-height:30px}
#mb-mid button{background:linear-gradient(#fff,#e3e3e3)}
#mb-mid button.main{background:linear-gradient(#ff3b4e,#d40f23);color:#fff;box-shadow:0 3px 0 #86000f,0 5px 8px rgba(232,17,35,.35)}
#mb-mid button.alt{background:linear-gradient(#e9e9e9,#cfcfcf)}
#dtabs{background:linear-gradient(#171717,#101010)}
#dtabs .chips button{font-size:11px;padding:5px 2px;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.08);background:#2a2a2a;color:#c8c8c8;border-radius:8px}
#dtabs .chips button.on{background:linear-gradient(#fff,#e3e3e3);color:#111;box-shadow:0 2px 0 #e81123,inset 0 1px 0 #fff}
#dtabs .hint{font:700 11px "Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.14em;color:#d8d8d8;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dtabs .hint b{color:#fff}
/* =====================================================================
   PHONES: disabled controls are hidden instead of greyed out; the controls
   that already live in the top bar are not repeated in the pages
   ===================================================================== */
body.split .dockel .dis{visibility:hidden!important}
body.split .dockel [data-n="Command17"],body.split .dockel [data-n="Command8"],
body.split .dockel [data-n="Command3"],body.split .dockel [data-n="Command9"],body.split .dockel [data-n="Command6"]{display:none!important}

/* =====================================================================  PLAY CONTROLS (phones)  ===================================================================== */
#pdock{position:fixed;z-index:5800;display:none;flex-direction:column;gap:8px;padding:8px;box-sizing:border-box;background:linear-gradient(#171717,#0e0e0e);border-top:1px solid #2c2c2c;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;touch-action:manipulation}
#pdock .stats{display:flex;gap:8px}
#pdock .stat{flex:1;min-width:0;background:#222;border:1px solid #343434;border-radius:11px;padding:5px 10px 4px;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
#pdock .stat small{font-weight:800;font-size:9px;letter-spacing:.22em;color:#8d8d8d}
#pdock .stat b{font-weight:800;font-size:20px;letter-spacing:.05em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
#pdock .stat.name b{font-size:14px;letter-spacing:.06em;line-height:1.5}
#pdock .stat.hot b{color:#ff5a68}
#pdock .seg{display:flex;gap:3px;padding:3px;background:#222;border:1px solid #343434;border-radius:11px}
#pdock .seg button{flex:1;min-width:0;border:0;border-radius:8px;background:transparent;color:#b5b5b5;font:800 11px "Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.12em;padding:9px 2px;touch-action:manipulation;transition:background .12s,color .12s}
#pdock .seg button.on{background:linear-gradient(#fff,#e3e3e3);color:#111;box-shadow:0 2px 0 #e81123}
#pdock .seg .lbl2{flex:none;align-self:center;padding:0 8px 0 6px;font:800 9px "Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.2em;color:#8d8d8d}
#pdock .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-height:0}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;font:800 10px "Segoe UI",Tahoma,Arial,sans-serif;letter-spacing:.1em;min-height:52px;touch-action:manipulation;text-align:center}
.cbtn svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.on{background:linear-gradient(#29c455,#0a8f2c);color:#fff;box-shadow:0 3px 0 #05601c,0 5px 8px rgba(0,0,0,.3)}
.cbtn.on:active{box-shadow:0 1px 0 #05601c}
#pdock.watch .btns{grid-template-columns:repeat(2,1fr)}
#pad .grip{justify-content:space-between;padding:0 10px}
#pad .grip .rs{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;cursor:pointer;touch-action:manipulation}
#pad .grip .sp{width:22px}
@media (orientation:landscape){#pdock .stats{flex-wrap:wrap}#pdock .btns{grid-template-columns:repeat(2,1fr)}.cbtn{flex-direction:row;gap:8px;font-size:11px;min-height:44px}}
body.split .dockel .txt:disabled{visibility:hidden!important}
body.split .dockel [data-n="Shape10"]{display:none!important}
.dback{display:none}
body.split .dback{display:block;position:absolute;z-index:2}

.ctl.mh{display:none!important}
body.split .ctl.mbl:not(.hide):not(.mh){display:flex!important;align-items:center;justify-content:center;text-align:center;border-radius:10px!important;background:linear-gradient(#fff,#e1e1e1)!important;color:#111!important;font-weight:700;letter-spacing:.03em;box-shadow:0 3px 0 #8a8a8a,0 5px 8px rgba(0,0,0,.22),inset 0 1px 0 #fff!important;cursor:pointer;text-shadow:none;opacity:1;transition:transform .07s,box-shadow .07s}
body.split .ctl.mbl:not(.hide):not(.mh):active{transform:translateY(2px);box-shadow:0 1px 0 #8a8a8a,inset 0 1px 0 #fff!important}
#mb-mid .mname{flex:1;align-self:center;text-align:center;font:800 13px 'Segoe UI',Tahoma,Arial,sans-serif;letter-spacing:.12em;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mb-menu{flex:none}
[data-n="PAG"]{white-space:pre!important;text-align:center}

/* =====================================================================  MODERN PHONE UI  ===================================================================== */
#udock{position:fixed;z-index:5800;display:none;flex-direction:column;box-sizing:border-box;background:linear-gradient(#171717,#0e0e0e);border-top:1px solid #2c2c2c;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#udock .view{display:none;flex-direction:column;gap:10px;padding:10px;min-height:0;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#udock .tabs{display:flex;gap:6px;padding:4px;background:#222;border:1px solid #343434;border-radius:12px;flex:none}
#udock .tabs button{flex:1;border:0;border-radius:9px;background:transparent;color:#b5b5b5;font:800 12px "Segoe UI",Arial,sans-serif;letter-spacing:.14em;padding:10px 4px;touch-action:manipulation}
#udock .tabs button.on{background:linear-gradient(#fff,#e3e3e3);color:#111;box-shadow:0 2px 0 #e81123}
#udock .pgs{display:flex;flex-direction:column;flex:1;min-height:0}
#udock .pg{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
#udock .pg.col{overflow-y:auto}
#udock .hint{font:600 12px "Segoe UI",Arial,sans-serif;letter-spacing:.04em;color:#b9b9b9;text-align:center;padding:2px 6px}
#udock .sec{display:flex;flex-direction:column;gap:8px;background:#1f1f1f;border:1px solid #303030;border-radius:14px;padding:10px;flex:none}
#udock .sec .st,#udock .lab{font:800 10px "Segoe UI",Arial,sans-serif;letter-spacing:.22em;color:#8d8d8d;padding:2px 2px 0}
#udock .tg{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#262626;border:1px solid #363636;border-radius:12px;padding:10px 12px;color:#fff;font:600 14px "Segoe UI",Arial,sans-serif;text-align:left;touch-action:manipulation;min-height:44px}
#udock .tg .sw{flex:none;width:44px;height:26px;border-radius:13px;background:#444;position:relative;transition:background .15s}
#udock .tg .sw i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
#udock .tg.on .sw{background:linear-gradient(#29c455,#0a8f2c)}
#udock .tg.on .sw i{transform:translateX(18px)}
#udock .stp{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#262626;border:1px solid #363636;border-radius:12px;padding:6px 8px 6px 12px;min-height:46px}
#udock .stp .tl,#udock .tg .tl{font:600 14px "Segoe UI",Arial,sans-serif}
#udock .sb{display:flex;align-items:center;gap:6px}
#udock .sb button{width:38px;height:38px;border-radius:10px;border:0;background:linear-gradient(#fff,#e3e3e3);color:#111;font:800 20px "Segoe UI",Arial,sans-serif;box-shadow:0 2px 0 #8a8a8a;touch-action:manipulation;line-height:1;padding:0}
#udock .sb button:active{transform:translateY(2px);box-shadow:none}
#udock .sb input{width:72px;height:38px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;text-align:center;font:700 17px "Segoe UI",Arial,sans-serif;-webkit-user-select:text;user-select:text}
#udock .sb input:focus{outline:2px solid #0b84ff;border-color:#0b84ff}
#udock .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#udock .two .stp{flex-direction:column;align-items:stretch;gap:4px;padding:6px 8px}
#udock .two .stp .tl{font-size:11px;letter-spacing:.14em;color:#9a9a9a}
#udock .two .stp .sb{justify-content:space-between}
#udock .two .stp .sb input{width:100%;min-width:0;flex:1}
#udock .ub{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:linear-gradient(#fff,#e3e3e3);color:#111;font:800 13px "Segoe UI",Arial,sans-serif;letter-spacing:.1em;padding:12px 10px;min-height:46px;box-shadow:0 3px 0 #8a8a8a,0 5px 8px rgba(0,0,0,.35);touch-action:manipulation;flex:none}
#udock .ub:active{transform:translateY(2px);box-shadow:0 1px 0 #8a8a8a}
#udock .ub.sm{min-height:42px;font-size:12px}
#udock .ub.danger{background:linear-gradient(#ff5a68,#d40f23);color:#fff;box-shadow:0 3px 0 #86000f,0 5px 8px rgba(0,0,0,.35)}
#udock .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#udock .tiles{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;flex:1}
#udock .ub.tile{flex-direction:column;gap:8px;font-size:13px;min-height:84px}
#udock .ub.tile .ic{width:30px;height:30px}
#udock .sg{display:flex;gap:4px;padding:4px;background:#222;border:1px solid #343434;border-radius:12px;flex:none}
#udock .sg button{flex:1;border:0;border-radius:9px;background:transparent;color:#b9b9b9;font:800 12px "Segoe UI",Arial,sans-serif;letter-spacing:.1em;padding:11px 4px;touch-action:manipulation}
#udock .sg button.on{background:linear-gradient(#fff,#e3e3e3);color:#111;box-shadow:0 2px 0 #e81123}
/* browse */
#udock .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
#udock .card{display:flex;align-items:center;gap:10px;background:#262626;border:1px solid #363636;border-radius:12px;color:#fff;padding:6px 10px;text-align:left;touch-action:manipulation;min-height:38px;overflow:hidden}
#udock .card .no{flex:none;min-width:26px;height:26px;border-radius:8px;background:#383838;color:#cfcfcf;font:800 11px "Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center}
#udock .card .nm{font:700 13px "Segoe UI",Arial,sans-serif;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#udock .card.on{background:linear-gradient(#fff,#e9e9e9);color:#111;border-color:#fff;box-shadow:0 3px 0 #e81123}
#udock .card.on .no{background:#e81123;color:#fff}
#udock .nav{display:flex;align-items:center;gap:8px;flex:none}
#udock .nav .navb{flex:1;min-height:42px;padding:8px}
#udock .pgno{flex:none;font:700 12px "Segoe UI",Arial,sans-serif;letter-spacing:.14em;color:#b0b0b0;text-align:center;min-width:88px}
#udock .pgno b{color:#fff}
#udock .dname{font:800 20px "Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#fff;flex:none;line-height:1.15}
#udock .srow{display:flex;align-items:center;gap:12px;flex:none}
#udock .stars{display:flex;gap:2px}
#udock .stars svg{width:26px;height:26px;fill:#333;stroke:#555;stroke-width:1.2;stroke-linejoin:round}
#udock .stars svg.on{fill:#ffc90e;stroke:#b98e00}
#udock .rate{display:flex;flex-direction:column;font:700 12px "Segoe UI",Arial,sans-serif;letter-spacing:.1em;line-height:1.3}
#udock .rate span{color:#8d8d8d;font-weight:600;letter-spacing:.04em}
#udock .desc{font:500 14px/1.45 "Segoe UI",Arial,sans-serif;color:#d6d6d6;white-space:pre-wrap;overflow-y:auto;min-height:20px;flex:1}
#udock .mchips{display:flex;flex-wrap:wrap;gap:6px;flex:none}
#udock .mchips i{font:800 10px "Segoe UI",Arial,sans-serif;letter-spacing:.12em;font-style:normal;background:#2a2a2a;border:1px solid #444;color:#e8e8e8;border-radius:20px;padding:5px 10px}
#udock .mchips i.none{background:transparent;border-style:dashed;color:#8d8d8d}
#udock .acts{display:flex;flex-wrap:wrap;gap:8px;flex:none}
#udock .acts .ub{flex:1 1 40%}
/* edit / maze tab */
#udock .tin{width:100%;border-radius:12px;border:1px solid #444;background:#111;color:#fff;padding:12px;font:700 16px "Segoe UI",Arial,sans-serif;letter-spacing:.04em;-webkit-user-select:text;user-select:text;resize:none;flex:none}
#udock textarea.tin{min-height:82px;font-weight:500;font-size:14px}
#udock .tin:focus{outline:2px solid #0b84ff;border-color:#0b84ff}
#udock .stat{font:700 12px "Segoe UI",Arial,sans-serif;letter-spacing:.1em;color:#a8a8a8;text-align:center;flex:none}
/* color */
#udock .sws{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
#udock .swc{aspect-ratio:1;border:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);touch-action:manipulation;min-height:30px}
#udock .swc.sel{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px #e81123}
#udock .tgts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#udock .tgt{border:1px solid #3b3b3b;border-radius:10px;background:#262626;color:#d4d4d4;font:800 11px "Segoe UI",Arial,sans-serif;letter-spacing:.08em;padding:11px 4px;touch-action:manipulation}
#udock .tgt.on{background:linear-gradient(#fff,#e3e3e3);color:#111;border-color:#fff;box-shadow:0 2px 0 #e81123}
/* music */
#udock .songs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#udock .song{border:1px solid #3b3b3b;border-radius:10px;background:#262626;color:#d9d9d9;font:700 12px "Segoe UI",Arial,sans-serif;letter-spacing:.06em;padding:12px 4px;touch-action:manipulation}
#udock .song.on{background:linear-gradient(#fff,#e3e3e3);color:#111;border-color:#fff;box-shadow:0 2px 0 #e81123}
#udock .song.off{opacity:.45}
#udock input.vol{flex:1;min-width:120px;accent-color:#e81123;height:30px}
/* VB popups that remain (wall list) get the dark look */
body.split .ovel .pic,body.split .ovel .cl{background:#1b1b1b!important}
body.split .ovel .lbl:not([data-n="LISTSs"]){color:#eee!important;background:transparent!important}

function parseDat(text){
  const tk=[];let i=0;const L=text.length;

    if(ch==='"'){let j=i+1,s='';while(j<L){if(text[j]==='"'){if(text[j+1]==='"'){s+='"';j+=2;continue;}break;}s+=text[j++];}tk.push(s);i=j+1;}
    else if(ch===','||ch==='\r'||ch==='\n'||ch===' '){i++;}
    else{let j=i;while(j<L&&text[j]!==','&&text[j]!=='\r'&&text[j]!=='\n')j++;tk.push(Number(text.slice(i,j).trim()));i=j;}
  }
  let k=0;const g=()=>tk[k++];
  const o={h:[g(),g(),g(),g(),String(g()),String(g()),g()],y:[],f:[],w:[],s:[],n:[]};
  for(let q=0;q<8;q++)o.y.push(g());for(let q=0;q<6;q++)o.f.push(g());
  for(let q=0;q<2000;q++){const r=[g(),g(),g(),g(),g(),g()];if(r[1]<40000)o.w.push([q].concat(r));}
  for(let q=0;q<50;q++)o.s.push(g()||0);for(let q=0;q<50;q++)o.n.push(g()||0);

   GESTURE - nothing on screen; swipe anywhere, even over the buttons (taps still click)
   ===================================================================== */
const Touch=(()=>{
  const continuous=()=>N(MakeMaze.C.Check8[1].p.Value)===1;
  const setDir=d=>{
    if(d===MazeCon.Tag)return;
    /* CONTINUOUS mode: you pick a direction, travel until you hit something, stop - and only then can you pick again.
       (the game puts the direction back to "none" itself when you stop) */
    if(d!==9&&continuous()&&MazeCon.Tag!==9)return;
    MazeCon.Tag=d;if(d!==9){if(window.SFX)SFX.click('pad');autoHideNow();}
  };
  const dirOf=(dx,dy)=>Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?1:0);
  /* ---- SWIPE (floating ring under the finger) ---- */
  let surf,ring,kn,arrows,sid=null,ax=0,ay=0,sfade=0;
  function initSwipe(){
    surf=$q('tsurf');ring=$q('tring');kn=ring.querySelector('.kn');arrows=[...ring.querySelectorAll('.ar')];
    surf.addEventListener('pointerdown',e=>{
      if(sid!==null||!surf._on)return;
      sid=e.pointerId;try{surf.setPointerCapture(sid);}catch(_){}
      ax=e.clientX;ay=e.clientY;clearTimeout(sfade);
      ring.style.left=ax+'px';ring.style.top=ay+'px';ring.classList.add('on');paintRing(0,0,9);e.preventDefault();
      autoHideNow();
    });
    surf.addEventListener('pointermove',e=>{
      if(e.pointerId!==sid)return;
      let dx=e.clientX-ax,dy=e.clientY-ay;const dist=Math.hypot(dx,dy),Rr=46;
      if(dist>Rr){const k=(dist-Rr)/dist;ax+=dx*k;ay+=dy*k;dx=e.clientX-ax;dy=e.clientY-ay;ring.style.left=ax+'px';ring.style.top=ay+'px';}
      let d=MazeCon.Tag;
      if(Math.hypot(dx,dy)>=13)d=dirOf(dx,dy);else if(!continuous())d=9;
      setDir(d);paintRing(dx,dy,MazeCon.Tag);
    });
    const end=e=>{if(e.pointerId!==sid)return;sid=null;if(!continuous())setDir(9);paintRing(0,0,9);sfade=setTimeout(()=>ring.classList.remove('on'),160);};
    surf.addEventListener('pointerup',end);surf.addEventListener('pointercancel',end);
  }
  function paintRing(dx,dy,d){
    const mg=Math.hypot(dx,dy),k=mg>32?32/mg:1;kn.style.transform='translate('+(dx*k)+'px,'+(dy*k)+'px)';
    arrows.forEach(a=>a.classList.toggle('p',+a.dataset.d===d));
  }
  /* ---- STICK (movable, translucent) ---- */
  let stick,sk,sg,pid=null,gid=null,gdx=0,gdy=0;
  function stickPos(){
    const p=Settings.get('stickPos');const g=PlayMaze.geo;
    if(p&&p.x!=null)return {x:p.x*innerWidth,y:p.y*innerHeight};
    const rg=g?g.rg:{x:0,y:0,w:innerWidth,h:innerHeight};
    return MOB.cls==='port'?{x:rg.x+rg.w-90,y:rg.y+rg.h-90}:{x:rg.x+90,y:rg.y+rg.h-90};
  }
  function placeStick(){
    const p=stickPos(),x=clampN(p.x,70,innerWidth-70),y=clampN(p.y,70,innerHeight-70);
    stick.style.left=x+'px';stick.style.top=y+'px';stick._c={x,y};
  }
  function initStick(){
    stick=$q('stick');sk=stick.querySelector('.kn');sg=stick.querySelector('.grip');
    stick.addEventListener('pointerdown',e=>{
      if(e.target===sg||pid!==null)return;
      pid=e.pointerId;try{stick.setPointerCapture(pid);}catch(_){}e.preventDefault();moveStick(e);
    });
    stick.addEventListener('pointermove',e=>{if(e.pointerId===pid)moveStick(e);});
    const end=e=>{if(e.pointerId!==pid)return;pid=null;sk.style.transform='translate(0,0)';stick.querySelectorAll('.ar').forEach(a=>a.classList.remove('p'));if(!continuous())setDir(9);};
    stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);
    sg.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();gid=e.pointerId;sg.setPointerCapture(gid);const c=stick._c;gdx=e.clientX-c.x;gdy=e.clientY-c.y;});
    sg.addEventListener('pointermove',e=>{if(e.pointerId!==gid)return;const x=clampN(e.clientX-gdx,70,innerWidth-70),y=clampN(e.clientY-gdy,70,innerHeight-70);stick.style.left=x+'px';stick.style.top=y+'px';stick._c={x,y};});
    const gend=e=>{if(e.pointerId!==gid)return;gid=null;const c=stick._c;Settings.set('stickPos',{x:c.x/innerWidth,y:c.y/innerHeight});};
    sg.addEventListener('pointerup',gend);sg.addEventListener('pointercancel',gend);
  }
  function moveStick(e){
    const c=stick._c;let dx=e.clientX-c.x,dy=e.clientY-c.y;const mg=Math.hypot(dx,dy),k=mg>38?38/mg:1;
    sk.style.transform='translate('+(dx*k)+'px,'+(dy*k)+'px)';
    let d=9;if(mg>=15)d=dirOf(dx,dy);else if(continuous())d=MazeCon.Tag;
    setDir(d);stick.querySelectorAll('.ar').forEach(a=>a.classList.toggle('p',+a.dataset.d===d));
  }
  /* ---- GESTURE (invisible; works over every control, taps still click) ---- */
  let gp=null,swallow=0;
  function initGesture(){
    const active=e=>ctlMode()==='gesture'&&gestureOn&&!e.target.closest('input,textarea,#dlgback');
    window.addEventListener('pointerdown',e=>{
      if(!active(e)||gp)return;gp={id:e.pointerId,ax:e.clientX,ay:e.clientY,x0:e.clientX,y0:e.clientY,moved:false};
    },true);
    window.addEventListener('pointermove',e=>{
      if(!gp||e.pointerId!==gp.id)return;
      let dx=e.clientX-gp.ax,dy=e.clientY-gp.ay;const dist=Math.hypot(dx,dy),Rr=46;
      if(!gp.moved&&Math.hypot(e.clientX-gp.x0,e.clientY-gp.y0)<13)return;
      gp.moved=true;if(dist>Rr){const k=(dist-Rr)/dist;gp.ax+=dx*k;gp.ay+=dy*k;dx=e.clientX-gp.ax;dy=e.clientY-gp.ay;}
      let d=MazeCon.Tag;if(Math.hypot(dx,dy)>=13)d=dirOf(dx,dy);else if(!continuous())d=9;setDir(d);
    },true);
    const end=e=>{if(!gp||e.pointerId!==gp.id)return;if(gp.moved){swallow=Date.now()+140;if(!continuous())setDir(9);}gp=null;};
    window.addEventListener('pointerup',end,true);window.addEventListener('pointercancel',end,true);
    window.addEventListener('click',e=>{if(Date.now()<swallow){e.stopPropagation();e.preventDefault();}},true);
  }
  let gestureOn=false;
  function init(){initSwipe();initStick();initGesture();}
  /* ---- per frame ---- */
  function update(modalOn){
    const f=PlayMaze,playing=f.visible&&f.loaded&&document.body.classList.contains('ingame');
    const mode=ctlMode(),dlg=(typeof _dlgOpen!=='undefined'&&_dlgOpen)||window.__paused;
    const act=playing&&!modalOn&&!dlg&&!(f.C.Label10&&f.C.Label10.p.Visible&&f.C.Label10.p.Left<40000);
    // swipe surface
    const swOn=act&&mode==='swipe';
    if(surf){surf._on=swOn;surf.style.display=swOn?'block':'none';
      if(!swOn&&sid!==null){sid=null;if(!continuous())setDir(9);ring.classList.remove('on');}}
    // stick
    const stOn=act&&mode==='stick';
    if(stick){stick.style.display=stOn?'block':'none';if(stOn){const k=[innerWidth,innerHeight,JSON.stringify(Settings.get('stickPos')),MOB.cls].join();if(stick._k!==k&&gid===null){stick._k=k;placeStick();}}else if(pid!==null){pid=null;if(!continuous())setDir(9);}}
    // gesture
    gestureOn=act&&mode==='gesture';
    document.body.classList.toggle('play-gesture',gestureOn);
    document.body.classList.toggle('play-swipe',swOn);
    if(!gestureOn&&gp){gp=null;}
  }
  return {init,update};
})();
/* =====================================================================
   WIN / FAIL POPUPS (custom, modal: everything behind them is blocked)
   ===================================================================== */
const PModal=(()=>{
  let el,card,title,msg,stars,rateTxt,btns,lastKey='';
  const info={kind:'win',needRate:false};
  const run=fn=>()=>{SFX.click('CommandButton');try{const r=fn();if(r&&r.catch)r.catch(console.error);}catch(e){console.error(e);}};
  function init(){el=$q('pmodal');card=el.querySelector('.card');title=$q('pm-title');msg=$q('pm-msg');stars=$q('pm-stars');rateTxt=$q('pm-rate');btns=$q('pm-btns');}
  function shown(){const f=PlayMaze;return f.loaded&&f.visible&&(panelShown(f.C.Picture1)?'win':panelShown(f.C.Picture2)?'fail':'');}
  function update(){
    const kind=shown(),f=PlayMaze;
    if(!kind){if(el.classList.contains('on')){el.classList.remove('on');}lastKey='';return false;}
    const C=f.C,H=f.H;
    let b=[],t,m,rating=0,needRate=false;
    const vis=c=>c.p.Visible&&c.p.Left<40000;
    if(kind==='win'){
      t=C.Label3.p.Caption;m=C.Label6.p.Caption;
      const r=String(C.Label4.p.Caption||'');rating=['BAD','FINE','NORMAL','GOOD','GREAT'].findIndex(x=>r.indexOf('YOUR RATING: '+x)>=0)+1;
      if(vis(C.Label1))b.push(['SUBMIT RATING',()=>H.Label1_Click(),'main']);
      if(vis(C.Command4)||C.Command4.p.Visible)b.push(['RESTART',()=>H.Command4_Click()]);
      b.push(['VIEW MAZE',()=>H.Command1_Click(),'ghost']);
      if(C.Label5.p.Visible)b.push(['BACK TO MAZES',()=>H.Label5_Click()]);
      needRate=!C.Label5.p.Visible;
    }else{
      t=C.Label20.p.Caption;m=C.Label18.p.Caption;
      b.push(['TRY AGAIN',()=>H.Command5_Click(),'main']);
      b.push(['VIEW MAZE',()=>H.Command6_Click(),'ghost']);
      if(C.Label5.p.Visible||true)b.push(['BACK TO MAZES',()=>H.Command7_Click()]);
    }
    info.kind=kind;info.needRate=needRate;
    const key=[kind,t,m,rating,b.map(x=>x[0]).join(',')].join('|');
    if(key!==lastKey){
      lastKey=key;title.textContent=t;title.className=kind;msg.textContent=m;
      stars.style.display=kind==='win'?'flex':'none';
      if(kind==='win'){stars.innerHTML='';for(let i=0;i<5;i++){const s=document.createElement('button');s.className='st'+(i<rating?' on':'');s.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>';s.addEventListener('click',run(()=>H.Image1_Click(i)));stars.appendChild(s);}}
      rateTxt.textContent=kind==='win'?(rating?C.Label4.p.Caption:'TAP A STAR TO RATE'):'';
      btns.innerHTML='';
      b.forEach(x=>{const e=document.createElement('button');e.className='pb '+(x[2]||'');e.textContent=x[0];e.addEventListener('click',run(x[1]));btns.appendChild(e);});
    }
    if(!el.classList.contains('on')){el.classList.add('on');}
    return true;
  }
  return {init,update,info};
})();

  const MC=()=>MakeMaze.C,MH=()=>MakeMaze.H;

    star:'<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/>'

/* ---------- full screen ---------- */
const FSE=document.documentElement;
const fsSupported=()=>!!(FSE.requestFullscreen||FSE.webkitRequestFullscreen);
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function goFS(on){
  try{
    if(on&&!isFS()){const p=(FSE.requestFullscreen||FSE.webkitRequestFullscreen).call(FSE);if(p&&p.catch)p.catch(()=>{});}
    else if(!on&&isFS()){const p=(document.exitFullscreen||document.webkitExitFullscreen).call(document);if(p&&p.catch)p.catch(()=>{});}
  }catch(e){}
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  refreshSettings();setTimeout(fitAll,120);
}));
/* FULL SCREEN is a preference: while it is ON, any tap, click or key press puts you back in full screen (browsers only allow
   that from a user action, and leave it whenever the page reloads or you come back from another page). While it is OFF the
   game stays in its normal window. */
let _fsAt=0;
function keepFullScreen(){
  if(!fsSupported())return;
  const want=!!Settings.get('fullscreen'),now=performance.now();
  if(want&&!isFS()){if(now-_fsAt<300)return;_fsAt=now;goFS(true);}
  else if(!want&&isFS()){if(now-_fsAt<300)return;_fsAt=now;goFS(false);}
}
['pointerup','click','keydown','touchend'].forEach(ev=>document.addEventListener(ev,keepFullScreen,true));

/* ---------- animated maze behind the title ---------- */
function startTitleAnim(){
  stopTitleAnim();
  const cv=$('tc'),ctx=cv.getContext('2d');
  let W,H,dpr,cell,cols,rows,ox,oy,R,Bt,path,pi,hold,acc,last;
  function gen(){
    R=[];Bt=[];const seen=[];
    for(let r=0;r<rows;r++){R.push(new Array(cols).fill(true));Bt.push(new Array(cols).fill(true));seen.push(new Array(cols).fill(false));}
    const st=[[0,0]];seen[0][0]=true;const par={};
    while(st.length){
      const [r,c]=st[st.length-1];const nb=[];
      if(r>0&&!seen[r-1][c])nb.push([r-1,c,'u']);if(r<rows-1&&!seen[r+1][c])nb.push([r+1,c,'d']);
      if(c>0&&!seen[r][c-1])nb.push([r,c-1,'l']);if(c<cols-1&&!seen[r][c+1])nb.push([r,c+1,'r']);
      if(!nb.length){st.pop();continue;}
      const [nr,nc,d]=nb[Math.floor(Math.random()*nb.length)];
      if(d==='u')Bt[nr][nc]=false;if(d==='d')Bt[r][c]=false;if(d==='l')R[nr][nc]=false;if(d==='r')R[r][c]=false;
      seen[nr][nc]=true;par[nr+','+nc]=r+','+c;st.push([nr,nc]);
    }
    const ex=rows-1,ey=cols-1;path=[];let k=ex+','+ey;
    while(k){const [a,b]=k.split(',').map(Number);path.push([a,b]);k=par[k];}
    path.reverse();pi=0;hold=0;acc=0;
  }
  function build(){
    dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
    cell=Math.max(24,Math.round(Math.min(W,H)/13));cols=Math.max(4,Math.floor(W/cell));rows=Math.max(4,Math.floor(H/cell));
    ox=(W-cols*cell)/2;oy=(H-rows*cell)/2;gen();
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,W,H);
    ctx.lineCap='square';ctx.strokeStyle='#2a2a2a';ctx.lineWidth=Math.max(3,cell*0.16);ctx.beginPath();
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=ox+c*cell,y=oy+r*cell;
      if(R[r][c]){ctx.moveTo(x+cell,y);ctx.lineTo(x+cell,y+cell);}
      if(Bt[r][c]){ctx.moveTo(x,y+cell);ctx.lineTo(x+cell,y+cell);}
      if(c===0){ctx.moveTo(x,y);ctx.lineTo(x,y+cell);}
      if(r===0){ctx.moveTo(x,y);ctx.lineTo(x+cell,y);}
    }
    ctx.stroke();
    const q=cell*0.34;
    const e=path[path.length-1];ctx.fillStyle='#e81123';ctx.fillRect(ox+e[1]*cell+(cell-q)/2,oy+e[0]*cell+(cell-q)/2,q,q);
    for(let i=0;i<=pi&&i<path.length;i++){
      const p=path[i];const cx=ox+p[1]*cell+cell/2,cy=oy+p[0]*cell+cell/2;
      if(i<pi){ctx.fillStyle='rgba(255,255,255,'+(0.07+0.25*(i/Math.max(1,pi)))+')';ctx.fillRect(cx-q*0.25,cy-q*0.25,q*0.5,q*0.5);}
      else{ctx.fillStyle='#fff';ctx.fillRect(cx-q/2,cy-q/2,q,q);ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.strokeRect(cx-q/2,cy-q/2,q,q);ctx.strokeStyle='#2a2a2a';ctx.lineWidth=Math.max(3,cell*0.16);}
    }
  }
  function loop(now){
    titleAnim=requestAnimationFrame(loop);
    const dt=Math.min(100,now-(last||now));last=now;
    if(pi>=path.length-1){hold+=dt;if(hold>1600){gen();}}
    else{acc+=dt;const step=Math.max(22,Math.min(46,3000/path.length));while(acc>step&&pi<path.length-1){acc-=step;pi++;}}
    draw();
  }
  build();titleAnim=requestAnimationFrame(loop);
  window.__titleResize=()=>{if(titleAnim){build();}};
}

/* =====================================================================
   NAVIGATION: the browser / phone back button, Esc, PAUSE
   Every "layer" of the game (maze list, editor, a tool, a panel, the playing screen, a popup ...) is one step in the
   browser history, so Back always takes you one step out - and asks first whenever something could be lost.
     playing      Back -> PAUSE ("leave or keep playing?")           pause menu: Back -> keep playing
     result popup Back -> back to the maze list (not while a rating is still owed)
     viewing maze Back -> back to the result
     editor tool  Back -> leaves the tool        panel (modes/music/walls) Back -> closes it
     editor       Back -> "quit editing? unsaved changes are lost"
     maze list    Back -> "go back to the main menu?"
     main menu    Back -> leaves the page (the browser's own behaviour)
   ===================================================================== */

/* ---------- the stack of layers (0 = main menu) ---------- */
function navLevel(){
  let L=0;
  if(App.ingame){
    if(playingNow()){L=2;if(resultOpen()||Pause.on||document.body.classList.contains('viewing'))L=3;}
    else if(MakeMaze.visible&&MakeMaze.loaded){
      const k=actionsNow().key;
      L=k==='browse'?1:k==='edit:'?2:k==='walls'?4:k==='select'?5:3;
    }else L=1;
  }
  if(settingsOpen())L++;
  if(Sheet.on)L++;
  if(_dlgOpen)L++;
  return L;
}
const Nav=(()=>{
  const N0={hist:0,ignore:0,pending:false,timer:0};
  function init(){
    try{history.replaceState({sg:0},'');}catch(e){}
    N0.hist=0;
    setInterval(sync,150);          // the game loop is asleep on the main menu, so keep the history tidy from here too
    window.addEventListener('beforeunload',e=>{          // closing / reloading the tab in the middle of editing: ask first
      if(window.__noUnloadWarn)return;
      if(App.ingame&&MakeMaze.visible&&MakeMaze.loaded&&!playingNow()){const k=actionsNow().key;if(k!=='browse'&&k!=='none'){e.preventDefault();e.returnValue='';return '';}}
    });
    window.addEventListener('popstate',e=>{
      if(N0.ignore>0){N0.ignore--;N0.pending=false;clearTimeout(N0.timer);return;}
      N0.hist=(e.state&&typeof e.state.sg==='number')?e.state.sg:0;
      handle();
    });
  }
  function sync(){                 // keep the browser's history exactly as deep as the game is
    if(N0.pending)return;
    const L=navLevel();
    if(L>N0.hist){for(let i=N0.hist+1;i<=L;i++){try{history.pushState({sg:i},'');}catch(e){}}N0.hist=L;}
    else if(L<N0.hist){
      const n=N0.hist-L;N0.ignore++;N0.pending=true;N0.hist=L;
      clearTimeout(N0.timer);N0.timer=setTimeout(()=>{N0.pending=false;N0.ignore=0;},700);
      try{history.go(-n);}catch(e){N0.ignore=0;N0.pending=false;}
    }
  }
  /* what "back" means right now. Returns true when the game used it up. */
  function handle(){
    if(_dlgCancel){_dlgCancel();return true;}
    if(Sheet.on){Sheet.close();return true;}
    if(settingsOpen()){closeSettings();return true;}
    if(!App.ingame)return false;
    if(Pause.on){Pause.hide();return true;}
    if(playingNow()){
      const H=PlayMaze.H;
      if(resultOpen()){
        if(PModal.info.needRate)return true;                       // the first win must be rated before leaving
        H.Command3_Click();return true;
      }
      if(document.body.classList.contains('viewing')){H.Label10_Click();return true;}
      Pause.show();return true;
    }
    if(MakeMaze.visible&&MakeMaze.loaded){
      const a=actionsNow(),H=MakeMaze.H;
      switch(a.key){
        case 'select':H.Command29_Click();return true;
        case 'walls':H.Command31_Click();return true;
        case 'subm':H.Picture8_Click();return true;
        case 'subr':H.Label18_Click();return true;
        case 'edit:':H.Command9_Click();return true;                // asks "quit? unsaved progress is lost"
        case 'browse':confirmLeaveToTitle();return true;
        default:{const it=a.items.find(x=>x.cls==='big');if(it){it.fn();return true;}}
      }
    }
    return false;
  }
  return {
    init,sync,handle,
    back(){if(N0.hist>0){try{history.back();return;}catch(e){}}handle();},
    escape(){if(navLevel()>0)this.back();},
    get hist(){return N0.hist;}
  };
})();
